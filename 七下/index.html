<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班刊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            /* 消除默认滚动条留白 */
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            /* 去除边框 */
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- 替换成你要嵌入的网址/本地页面 -->
    <iframe src="https://zztxtkintel.dpdns.org/BK/七下"></iframe>
</body>
</html>
