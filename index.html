<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kali GRUB Boot Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Consolas", monospace;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: url("ZetaWaveH.png") center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .boot-container {
            width: 540px;
        }
        .header-tip {
            color: #cccccc;
            font-size: 14px;
            margin-bottom: 24px;
            text-align: center;
        }
        .countdown-text {
            color: #ffcc00;
            font-size: 16px;
            margin-bottom: 18px;
            text-align: center;
        }
        /* 透明毛玻璃菜单面板 */
        .boot-list {
            border: 1px solid rgba(80, 80, 80, 0.6);
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
        }
        .boot-item {
            padding: 13px 18px;
            font-size: 15px;
            color: #00ff00;
            cursor: pointer;
            transition: background 0.2s;
        }
        .boot-item.active {
            background: rgba(0, 100, 0, 0.7);
            color: #ffffff;
        }
        .hint-bottom {
            margin-top: 26px;
            color: #aaaaaa;
            font-size: 13px;
            line-height: 1.7;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="boot-container">
        <div class="header-tip">GNU GRUB  Version 2.06</div>
        <div class="countdown-text">倒计时：<span id="timer">10</span> 秒后自动启动【七下】</div>
        <div class="boot-list" id="bootMenu">
            <div class="boot-item active" data-link="./七下">七下（默认启动）</div>
        </div>
        <div class="hint-bottom">
            Enter 确认启动 | 点击选项直接跳转 | 等待倒计时自动运行默认系统
        </div>
    </div>
    <script>
        const defaultIndex = 0;
        const waitSecond = 10;
        let currentIndex = defaultIndex;
        let timerNum = waitSecond;
        let timer;
        const items = document.querySelectorAll('.boot-item');
        const timerDom = document.getElementById('timer');
        function updateSelect() {
            items.forEach((item, idx) => {
                item.classList.toggle('active', idx === currentIndex);
            })
        }
        function jumpPage(index) {
            clearInterval(timer);
            const targetUrl = items[index].dataset.link;
            window.location.href = targetUrl;
        }
        function startCountDown() {
            clearInterval(timer);
            timer = setInterval(() => {
                timerNum--;
                timerDom.innerText = timerNum;
                if (timerNum <= 0) {
                    jumpPage(defaultIndex);
                }
            }, 1000);
        }
        // 键盘操作
        document.addEventListener('keydown', e => {
            timerNum = waitSecond;
            timerDom.innerText = timerNum;
            startCountDown();
            if (e.key === 'Enter') {
                jumpPage(currentIndex);
            }
        })
        // 点击选项立即跳转
        items.forEach((item, idx) => {
            item.onclick = () => {
                currentIndex = idx;
                updateSelect();
                jumpPage(idx);
            }
        })
        updateSelect();
        startCountDown();
    </script>
</body>
</html>
