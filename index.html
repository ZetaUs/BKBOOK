<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班刊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe id="mainIframe" src="默认页面地址"></iframe>

    <script>
        const iframe = document.getElementById('mainIframe');
        // 哈希对应页面配置
        const pageMap = {
            "#七下": "https://zztxtkintel.dpdns.org/BK/七下",
            "#home": "https://zztxtkintel.dpdns.org/BK"
        };

        // 更新iframe地址函数
        function changePage() {
            const hash = location.hash;
            if(pageMap[hash]){
                iframe.src = pageMap[hash];
            }else{
                // 无匹配哈希时加载默认页
                iframe.src = pageMap["#七下"];
            }
        }

        // 页面初次加载执行一次
        changePage();
        // 监听地址栏#哈希变化
        window.addEventListener('hashchange', changePage);
    </script>
</body>
</html>
